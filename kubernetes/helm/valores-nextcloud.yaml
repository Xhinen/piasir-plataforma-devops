# Nextcloud para la plataforma del Ayuntamiento de Sierra Alta
# Grafico nextcloud/nextcloud 9.4.1 — Nextcloud 35.0.2

replicaCount: 1

nextcloud:
  host: nube.sierraalta.internal

  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: username
    passwordKey: password

  trustedDomains:
    - nube.sierraalta.internal

  extraEnv:
    - name: OVERWRITEPROTOCOL
      value: https
    - name: OVERWRITECLIURL
      value: https://nube.sierraalta.internal
    - name: TRUSTED_PROXIES
      value: 10.244.0.0/16

  configs:
    municipal.config.php: |-
      <?php
      $CONFIG = array (
        'default_phone_region' => 'ES',
        'maintenance_window_start' => 2,
      );

  phpConfigs:
    zz-municipal.ini: |
      memory_limit = 512M
      upload_max_filesize = 512M
      post_max_size = 512M
      max_execution_time = 3600

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: postgresql.nube.svc.cluster.local:5432
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: postgres-credenciales
    usernameKey: POSTGRES_USER
    passwordKey: POSTGRES_PASSWORD

externalRedis:
  enabled: true
  host: valkey.nube.svc.cluster.local
  port: "6379"

mariadb:
  enabled: false
postgresql:
  enabled: false
redis:
  enabled: false

persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 10Gi

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    schedule: "*/5 * * * *"

ingress:
  enabled: false

httpRoute:
  enabled: true
  hostnames:
    - nube.sierraalta.internal
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mi-gateway
      namespace: portfolio
      sectionName: https
  wellKnown:
    enabled: true
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=15552000; includeSubDomains"

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1536Mi

startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 60
