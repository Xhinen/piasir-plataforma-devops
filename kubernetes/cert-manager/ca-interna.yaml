---
# Emisor autofirmado. Su unica funcion es firmar el certificado raiz que viene
# a continuacion: no se usa para nada mas.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: autofirmado
spec:
  selfSigned: {}
---
# Certificado raiz de la autoridad de certificacion de la organizacion.
# Su clave privada vive en el secreto ca-raiz-sierra-alta del espacio de
# nombres cert-manager y no sale de ahi.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ca-raiz-sierra-alta
  namespace: cert-manager
spec:
  isCA: true
  commonName: Ayuntamiento de Sierra Alta - CA interna
  secretName: ca-raiz-sierra-alta
  duration: 87600h      # 10 anios
  renewBefore: 8760h    # se renueva un anio antes de caducar
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: autofirmado
    kind: ClusterIssuer
    group: cert-manager.io
---
# Emisor que usara todo lo demas. Firma con la raiz anterior.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ca-interna
spec:
  ca:
    secretName: ca-raiz-sierra-alta
