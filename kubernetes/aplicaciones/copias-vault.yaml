---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copias-vault
  namespace: vault
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: copia-vault
  namespace: vault
spec:
  schedule: "45 3 * * *"
  timeZone: Europe/Madrid
  startingDeadlineSeconds: 43200
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: copia
              image: alpine:3.24.3
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Europe/Madrid
              command:
                - sh
                - -c
                - |
                  set -eu
                  # Registro persistente: vive en el volumen de copias, no
                  # solo en el pod. Sobrevive al borrado del pod y permite
                  # investigar un fallo dias despues.
                  if [ -f /copias/registro.log ]; then
                    tail -n 2000 /copias/registro.log > /copias/registro.log.nuevo
                    mv /copias/registro.log.nuevo /copias/registro.log
                  fi
                  exec 3>&1
                  trap 'tail -n 40 /copias/registro.log >&3' EXIT
                  exec >> /copias/registro.log 2>&1
                  echo "===== $(date '+%F %T') inicio ====="
                  echo "== Preparando la herramienta =="
                  apk add --no-cache sqlite tzdata > /dev/null

                  FECHA=$(date +%Y%m%d-%H%M)

                  echo "== Limpieza de copias incompletas anteriores =="
                  rm -f /copias/*.parcial
                  echo "== Copia consistente de la base de datos =="
                  sqlite3 /datos/db.sqlite3 \
                    "VACUUM INTO '/copias/base-${FECHA}.sqlite3.parcial'"
                  mv "/copias/base-${FECHA}.sqlite3.parcial" "/copias/base-${FECHA}.sqlite3"

                  echo "== Verificacion de la copia =="
                  sqlite3 "/copias/base-${FECHA}.sqlite3" "PRAGMA integrity_check" | grep -q '^ok$'
                  echo "integridad correcta"

                  echo "== Empaquetado de adjuntos y material criptografico =="
                  estado_tar=0
                  tar czf "/copias/datos-${FECHA}.tar.gz.parcial" \
                    -C /datos --exclude='db.sqlite3*' --exclude='icon_cache' . || estado_tar=$?
                  if [ "$estado_tar" -gt 1 ]; then
                    echo "tar fallo con codigo $estado_tar" >&2
                    exit "$estado_tar"
                  fi
                  if [ "$estado_tar" -eq 1 ]; then
                    echo "aviso: algun fichero cambio durante el empaquetado"
                  fi
                  mv "/copias/datos-${FECHA}.tar.gz.parcial" "/copias/datos-${FECHA}.tar.gz"

                  echo "== Retencion: se conservan las 7 ultimas =="
                  ls -1t /copias/base-*.sqlite3 | tail -n +8 | xargs -r rm -f
                  ls -1t /copias/datos-*.tar.gz | tail -n +8 | xargs -r rm -f

                  echo "== Contenido del almacen de copias =="
                  ls -lh /copias
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: copias
                  mountPath: /copias
                - name: datos
                  mountPath: /datos
          volumes:
            - name: copias
              persistentVolumeClaim:
                claimName: copias-vault
            - name: datos
              persistentVolumeClaim:
                claimName: vaultwarden-datos
