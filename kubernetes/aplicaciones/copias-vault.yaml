---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copias-vault
  namespace: vault
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: copia-vault
  namespace: vault
spec:
  schedule: "45 3 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: copia
              image: alpine:3.24.3
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Europe/Madrid
              command:
                - sh
                - -c
                - |
                  set -eu
                  FECHA=$(date +%Y%m%d-%H%M)

                  echo "== Limpieza de copias incompletas anteriores =="
                  rm -f /copias/*.parcial

                  echo "== Preparando la herramienta =="
                  apk add --no-cache sqlite > /dev/null

                  echo "== Copia consistente de la base de datos =="
                  sqlite3 /datos/db.sqlite3 \
                    "VACUUM INTO '/copias/base-${FECHA}.sqlite3.parcial'"
                  mv "/copias/base-${FECHA}.sqlite3.parcial" "/copias/base-${FECHA}.sqlite3"

                  echo "== Empaquetado de adjuntos y material criptografico =="
                  tar czf "/copias/datos-${FECHA}.tar.gz.parcial" \
                    -C /datos --exclude='db.sqlite3*' --exclude='icon_cache' .
                  mv "/copias/datos-${FECHA}.tar.gz.parcial" "/copias/datos-${FECHA}.tar.gz"

                  echo "== Retencion: se conservan las 7 ultimas =="
                  ls -1t /copias/base-*.sqlite3 | tail -n +8 | xargs -r rm -f
                  ls -1t /copias/datos-*.tar.gz | tail -n +8 | xargs -r rm -f

                  echo "== Contenido del almacen de copias =="
                  ls -lh /copias
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: copias
                  mountPath: /copias
                - name: datos
                  mountPath: /datos
          volumes:
            - name: copias
              persistentVolumeClaim:
                claimName: copias-vault
            - name: datos
              persistentVolumeClaim:
                claimName: vaultwarden-datos
