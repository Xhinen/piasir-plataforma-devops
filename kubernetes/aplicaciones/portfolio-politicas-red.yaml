# Politicas de red del sitio web municipal
# Exportado por scripts/exportar-manifiestos.sh el 2026-10-23.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: aplicaciones-plataforma:networking.k8s.io/NetworkPolicy:portfolio/allow-from-gateway
  name: allow-from-gateway
  namespace: portfolio
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
    ports:
    - port: 80
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - portfolio
      - portfolio-v2
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: aplicaciones-plataforma:networking.k8s.io/NetworkPolicy:portfolio/default-deny-ingress
  name: default-deny-ingress
  namespace: portfolio
spec:
  podSelector: {}
  policyTypes:
  - Ingress
