---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    acceso-gateway: permitido
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-datos
  namespace: vault
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vault
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: DOMAIN
              value: https://vault.sierraalta.internal
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: ROCKET_ADDRESS
              value: 0.0.0.0
            - name: ROCKET_PORT
              value: "8080"
            - name: DATA_FOLDER
              value: /data
            - name: IP_HEADER
              value: X-Forwarded-For
            - name: IP_HEADER_TRUSTED_PROXIES
              value: 10.244.0.0/16
            - name: LOG_LEVEL
              value: warn
            - name: TZ
              value: Europe/Madrid
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: datos
              mountPath: /data
            - name: temporal
              mountPath: /tmp
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: vaultwarden-datos
        - name: temporal
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vault
spec:
  selector:
    app: vaultwarden
  ports:
    - name: http
      port: 80
      targetPort: http
