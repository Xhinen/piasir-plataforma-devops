# Segunda version del sitio web municipal, para el despliegue progresivo.
#
# Es la misma aplicacion, construida por la tuberia de integracion continua y
# descargada del registro propio, no de un registro publico. Se distingue de
# la primera por un fichero de marca montado desde un mapa de configuracion:
# asi se puede medir que proporcion del trafico atiende cada una sin tener
# que modificar la version en produccion.
#
# Etiquetas distintas (app: portfolio-v2) a proposito: el servicio de la
# version 1 selecciona app: portfolio, de modo que ambas versiones quedan
# detras de servicios separados y la pasarela puede repartir entre ellos.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-v2-marca
  namespace: portfolio
data:
  version.html: |
    v2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-v2
  namespace: portfolio
  labels:
    app: portfolio-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-v2
  template:
    metadata:
      labels:
        app: portfolio-v2
    spec:
      containers:
        - name: portfolio
          image: forja.sierraalta.internal/alberto/portfolio:e04c340520bfc689a42ee4ab91c31f9a448813df
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: marca
              mountPath: /usr/share/nginx/html/version.html
              subPath: version.html
      volumes:
        - name: marca
          configMap:
            name: portfolio-v2-marca
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-v2-service
  namespace: portfolio
  labels:
    app: portfolio-v2
spec:
  type: ClusterIP
  selector:
    app: portfolio-v2
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
