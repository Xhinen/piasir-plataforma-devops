# Encaminamiento del sitio web municipal, con el reparto de trafico
# Exportado por scripts/exportar-manifiestos.sh el 2026-10-23.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: aplicaciones-plataforma:gateway.networking.k8s.io/HTTPRoute:portfolio/portfolio-route
  name: portfolio-route
  namespace: portfolio
spec:
  hostnames:
  - portfolio.sierraalta.internal
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: mi-gateway
    sectionName: https
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: portfolio-service
      port: 80
      weight: 100
    matches:
    - path:
        type: PathPrefix
        value: /
