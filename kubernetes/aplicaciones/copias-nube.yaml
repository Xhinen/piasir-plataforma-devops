---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copias-nube
  namespace: nube
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: copia-nube
  namespace: nube
spec:
  schedule: "30 3 * * *"
  timeZone: Europe/Madrid
  startingDeadlineSeconds: 43200
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            acceso-base-de-datos: "si"
        spec:
          restartPolicy: Never
          initContainers:
            - name: esperar-base-de-datos
              image: postgres:17.11
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  intentos=0
                  until pg_isready -q; do
                    intentos=$((intentos + 1))
                    if [ "$intentos" -gt 60 ]; then
                      echo "la base de datos no responde tras cinco minutos"
                      exit 1
                    fi
                    echo "esperando a la base de datos..."
                    sleep 5
                  done
                  echo "base de datos disponible"
              env:
                - name: PGHOST
                  value: postgresql.forja.svc.cluster.local
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credenciales
                      key: POSTGRES_USER
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credenciales
                      key: POSTGRES_DB
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credenciales
                      key: POSTGRES_PASSWORD
          containers:
            - name: copia
              image: postgres:17.11
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Europe/Madrid
                - name: PGHOST
                  value: postgresql.nube.svc.cluster.local
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credenciales
                      key: POSTGRES_USER
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credenciales
                      key: POSTGRES_DB
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credenciales
                      key: POSTGRES_PASSWORD
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  # Registro persistente: vive en el volumen de copias, no
                  # solo en el pod. Sobrevive al borrado del pod y permite
                  # investigar un fallo dias despues, que es justo lo que
                  # no pudimos hacer con la copia fallida del 3-11-2026.
                  if [ -f /copias/registro.log ]; then
                    tail -n 2000 /copias/registro.log > /copias/registro.log.nuevo
                    mv /copias/registro.log.nuevo /copias/registro.log
                  fi
                  exec 3>&1
                  trap 'tail -n 40 /copias/registro.log >&3' EXIT
                  exec >> /copias/registro.log 2>&1
                  echo "===== $(date '+%F %T') inicio ====="
                  FECHA=$(date +%Y%m%d-%H%M)

                  echo "== Limpieza de copias incompletas anteriores =="
                  rm -f /copias/*.parcial

                  echo "== Volcado de la base de datos =="
                  pg_dump --format=custom --no-owner --no-privileges \
                    --file="/copias/base-${FECHA}.dump.parcial"
                  mv "/copias/base-${FECHA}.dump.parcial" "/copias/base-${FECHA}.dump"

                  echo "== Verificacion de la copia =="
                  pg_restore --list "/copias/base-${FECHA}.dump" > /dev/null
                  echo "volcado legible"

                  echo "== Empaquetado de los datos de usuario =="
                  estado_tar=0
                  tar czf "/copias/datos-${FECHA}.tar.gz.parcial" -C /datos-nube . || estado_tar=$?
                  if [ "$estado_tar" -gt 1 ]; then
                    echo "tar fallo con codigo $estado_tar" >&2
                    exit "$estado_tar"
                  fi
                  if [ "$estado_tar" -eq 1 ]; then
                    echo "aviso: algun fichero cambio durante el empaquetado"
                  fi
                  mv "/copias/datos-${FECHA}.tar.gz.parcial" "/copias/datos-${FECHA}.tar.gz"

                  echo "== Retencion: se conservan las 7 ultimas =="
                  ls -1t /copias/base-*.dump    | tail -n +8 | xargs -r rm -f
                  ls -1t /copias/datos-*.tar.gz | tail -n +8 | xargs -r rm -f

                  echo "== Contenido del almacen de copias =="
                  ls -lh /copias
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: copias
                  mountPath: /copias
                - name: datos-nube
                  mountPath: /datos-nube
                  subPath: data
                  readOnly: true
          volumes:
            - name: copias
              persistentVolumeClaim:
                claimName: copias-nube
            - name: datos-nube
              persistentVolumeClaim:
                claimName: nextcloud-nextcloud
                readOnly: true
