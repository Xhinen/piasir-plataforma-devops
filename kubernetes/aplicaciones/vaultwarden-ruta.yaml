# Encaminamiento del gestor de contrasenas corporativo
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden-route
  namespace: vault
spec:
  hostnames:
    - vault.sierraalta.internal
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mi-gateway
      namespace: portfolio
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: vaultwarden
          port: 80
