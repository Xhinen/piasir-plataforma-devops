# Punto unico de entrada de trafico al cluster
# Exportado por scripts/exportar-manifiestos.sh el 2026-10-23.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    cert-manager.io/cluster-issuer: ca-interna
  name: mi-gateway
  namespace: portfolio
spec:
  gatewayClassName: eg
  listeners:
  - allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            acceso-gateway: permitido
    hostname: '*.sierraalta.internal'
    name: http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            acceso-gateway: permitido
    hostname: '*.sierraalta.internal'
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ''
        kind: Secret
        name: comodin-sierraalta-tls
      mode: Terminate
