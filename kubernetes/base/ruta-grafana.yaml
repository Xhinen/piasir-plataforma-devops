# Entrada de trafico al panel de observabilidad.
#
# Grafana se publica con nombre propio porque es una interfaz de
# administracion para personas y tiene autenticacion propia.
#
# Prometheus NO se publica, deliberadamente: carece de autenticacion, y
# exponerlo equivaldria a ofrecer a cualquiera de la red un inventario
# completo de la plataforma. Grafana lo consulta internamente, y las
# consultas puntuales se hacen por tunel temporal.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
    - name: mi-gateway
      namespace: portfolio
      sectionName: https
  hostnames:
    - grafana.sierraalta.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: monitoring-grafana
          port: 80
