# Reglas de encaminamiento por nombre de servidor
# Exportado por scripts/exportar-manifiestos.sh el 2026-10-21.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio-route
  namespace: portfolio
spec:
  hostnames:
  - portfolio.sierraalta.internal
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: mi-gateway
    sectionName: https
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: portfolio-service
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirigir-a-https
  namespace: portfolio
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: mi-gateway
    sectionName: http
  rules:
  - filters:
    - requestRedirect:
        scheme: https
        statusCode: 301
      type: RequestRedirect
    matches:
    - path:
        type: PathPrefix
        value: /
