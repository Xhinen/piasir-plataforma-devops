# Reglas de encaminamiento por nombre de servidor.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio-route
  namespace: portfolio
spec:
  hostnames:
    - portfolio.sierraalta.internal
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mi-gateway
      sectionName: https
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: portfolio-service
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
# Todo lo que entre por el puerto 80 se redirige a HTTPS, sin excepciones.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirigir-a-https
  namespace: portfolio
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mi-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
