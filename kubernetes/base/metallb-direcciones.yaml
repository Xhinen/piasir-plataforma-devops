# Rango de direcciones que MetalLB asigna a los balanceadores
# Exportado por scripts/exportar-manifiestos.sh el 2026-10-21.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool-lan
  namespace: metallb-system
spec:
  addresses:
  - 192.168.18.240-192.168.18.250
  autoAssign: true
  avoidBuggyIPs: false
