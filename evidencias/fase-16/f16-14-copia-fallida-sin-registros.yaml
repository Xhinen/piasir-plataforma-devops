        job-name: copia-nube-29894550
    spec:
      containers:
      - command:
        - bash
        - -c
        - |
          set -euo pipefail
          FECHA=$(date +%Y%m%d-%H%M)

          echo "== Limpieza de copias incompletas anteriores =="
          rm -f /copias/*.parcial

          echo "== Volcado de la base de datos =="
          pg_dump --format=custom --no-owner --no-privileges \
            --file="/copias/base-${FECHA}.dump.parcial"
          mv "/copias/base-${FECHA}.dump.parcial" "/copias/base-${FECHA}.dump"

          echo "== Verificacion de la copia =="
          pg_restore --list "/copias/base-${FECHA}.dump" > /dev/null
          echo "volcado legible"

          echo "== Empaquetado de los datos de usuario =="
          tar czf "/copias/datos-${FECHA}.tar.gz.parcial" -C /datos-nube .
          mv "/copias/datos-${FECHA}.tar.gz.parcial" "/copias/datos-${FECHA}.tar.gz"

          echo "== Retencion: se conservan las 7 ultimas =="
          ls -1t /copias/base-*.dump    | tail -n +8 | xargs -r rm -f
          ls -1t /copias/datos-*.tar.gz | tail -n +8 | xargs -r rm -f

          echo "== Contenido del almacen de copias =="
          ls -lh /copias
        env:
        - name: TZ
          value: Europe/Madrid
        - name: PGHOST
          value: postgresql.nube.svc.cluster.local
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: postgres-credenciales
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              key: POSTGRES_DB
              name: postgres-credenciales
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: postgres-credenciales
        image: postgres:17.11
        imagePullPolicy: IfNotPresent
        name: copia
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /copias
          name: copias
        - mountPath: /datos-nube
          name: datos-nube
          readOnly: true
          subPath: data
      dnsPolicy: ClusterFirst
      restartPolicy: OnFailure
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: copias
        persistentVolumeClaim:
          claimName: copias-nube
      - name: datos-nube
        persistentVolumeClaim:
          claimName: nextcloud-nextcloud
          readOnly: true
