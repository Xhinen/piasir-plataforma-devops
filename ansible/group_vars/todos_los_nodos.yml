---
# Variables comunes a todas las maquinas gestionadas.
# Las versiones se fijan de forma explicita: una etiqueta movil hace que dos
# despliegues aparentemente identicos ejecuten software distinto.

zona_horaria: "Europe/Madrid"
locale_sistema: "es_ES.UTF-8"

paquetes_base:
  - curl
  - gnupg
  - ca-certificates
  - apt-transport-https
  - python3-apt
  - chrony
  - vim
  - htop

# --- Endurecimiento -------------------------------------------------------
ssh_permitir_root: false
ssh_solo_clave: true
fail2ban_maxretry: 4
fail2ban_bantime: "1h"

# --- Versiones fijadas ----------------------------------------------------
# CONFIRMAR: comprueba la cadena exacta en un nodo ya montado con
#   apt-cache policy containerd.io
# y pega aqui la version instalada.
version_containerd_paquete: "2.2.6-1"

# CONFIRMAR: idem con
#   apt-cache policy kubelet
version_kubernetes_paquete: "1.36.2-1.1"

# CONFIRMAR: rama del repositorio de Kubernetes (sin el parche)
version_kubernetes_rama: "v1.36"

# --- Red del cluster ------------------------------------------------------
cidr_pods: "10.244.0.0/16"
