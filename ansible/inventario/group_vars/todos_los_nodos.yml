---
# Variables comunes a todas las maquinas gestionadas.
# Las versiones se fijan de forma explicita: una etiqueta movil hace que dos
# despliegues aparentemente identicos ejecuten software distinto.

zona_horaria: "Europe/Madrid"
locale_sistema: "es_ES.UTF-8"

paquetes_base:
  - curl
  - gnupg
  - ca-certificates
  - apt-transport-https
  - python3-apt
  - chrony
  - vim
  - htop

# --- Endurecimiento -------------------------------------------------------
ssh_permitir_root: false
ssh_solo_clave: true
fail2ban_maxretry: 4
fail2ban_bantime: "1h"

# --- Versiones fijadas ----------------------------------------------------
# Version verificada el 12-10-2026 con 'apt-cache policy containerd.io'.
# La documentacion del proyecto reflejaba 2.2.6; el paquete se encontraba en
# 2.4.1 por no haberse fijado con 'apt-mark hold'. Se fija la version real en
# uso y el rol aplica el bloqueo para evitar que vuelva a desplazarse.
version_containerd_paquete: "2.4.1-2~ubuntu.24.04~noble"

# Version verificada el 12-10-2026. Los tres paquetes permanecen en 1.36.2
# pese a existir 1.36.5 en el repositorio, porque estaban retenidos con
# 'apt-mark hold'. Contrasta con containerd, que no lo estaba y se desplazo.
version_kubernetes_paquete: "1.36.2-2.1"

# Rama del repositorio de Kubernetes, sin el numero de parche.
version_kubernetes_rama: "v1.36"

# --- Red del cluster ------------------------------------------------------
cidr_pods: "10.244.0.0/16"
