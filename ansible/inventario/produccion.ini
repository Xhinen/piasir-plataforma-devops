# Inventario de produccion de la plataforma
# Alta de un nodo nuevo: anadir la linea aqui y ejecutar el playbook correspondiente.

[contenedores]
docker-01  ansible_host=192.168.18.52

[kubernetes_plano_control]
k8s-master ansible_host=192.168.18.54

[kubernetes_trabajadores]
