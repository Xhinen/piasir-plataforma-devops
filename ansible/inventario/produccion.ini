# Inventario de produccion de la plataforma.
# Alta de un nodo nuevo: anadir su linea en el grupo que corresponda
# y ejecutar el playbook. Nada mas.

[contenedores]
docker-01     ansible_host=192.168.18.52  ansible_user=kaneda

[kubernetes_plano_control]
k8s-master    ansible_host=192.168.18.54  ansible_user=k8smaster

[kubernetes_trabajadores]
k8s-worker    ansible_host=192.168.18.53  ansible_user=k8sworker
k8s-worker-02 ansible_host=192.168.18.58  ansible_user=k8sworker2

[kubernetes:children]
kubernetes_plano_control
kubernetes_trabajadores

[todos_los_nodos:children]
contenedores
kubernetes

[todos_los_nodos:vars]
ansible_ssh_private_key_file = ~/.ssh/id_ed25519
ansible_python_interpreter   = /usr/bin/python3

[servicios_base]
dns-01 ansible_host=192.168.18.51  ansible_user=root
